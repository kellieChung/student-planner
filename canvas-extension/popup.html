<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Planner</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <h1>🎓 Student Planner</h1>

    <label for="appUrl">App URL</label>

    <input
        id="appUrl"
        type="text"
        placeholder="https://student-planner-beta.vercel.app"
    />

    <button id="saveAppUrlButton">
        Save App URL
    </button>

    <p id="appUrlStatus" aria-live="polite"></p>

    <hr />

    <button id="loginButton">
        Sign in with Google
    </button>

    <p>Connect your Canvas account.</p>

    <label for="canvasUrl">Canvas URL</label>

    <input
        id="canvasUrl"
        type="text"
        placeholder="https://school.instructure.com"
    />

    <button id="connectButton">
        Connect Canvas
    </button>

    <p id="status" aria-live="polite">Loading...</p>

    <button id="syncButton">
        🔄 Sync Canvas
    </button>

    <div id="syncProgress" hidden>
        <div id="syncProgressBar">
            <div id="syncProgressFill"></div>
        </div>
        <p id="syncProgressText"></p>
    </div>

    <button id="cancelSyncButton" hidden>
        ✖ Cancel Sync
    </button>

    <hr />

    <p>Deleted a course by mistake? Pull it back in from Canvas.</p>

    <button id="loadCoursesButton">
        📚 Find Canvas Courses
    </button>

    <select id="restoreCourseSelect" hidden></select>

    <button id="restoreCourseButton" hidden>
        ➕ Restore Course
    </button>


    <script src="popup.js"></script>
</body>
</html>
